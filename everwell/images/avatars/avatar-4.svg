<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Reviewer photo placeholder">
  <!-- [[PLACEHOLDER IMAGE]] Reviewer portrait. Replace with a real photo (600x800, 3:4). -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="hsl(24 14% 94%)"/>
      <stop offset="100%" stop-color="hsl(24 14% 84%)"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="hsl(12 22% 55%)"/>
      <stop offset="100%" stop-color="hsl(12 22% 42%)"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="hsl(24 14% 72%)"/>
      <stop offset="100%" stop-color="hsl(24 14% 62%)"/>
    </linearGradient>
    <clipPath id="frame"><rect width="600" height="800"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="800" fill="url(#room)"/>

    <!-- a suggestion of a bedroom behind: headboard and a lamp -->
    <rect x="70" y="150" width="460" height="330" rx="36" fill="hsl(24 14% 81%)" opacity="0.75"/>
    <circle cx="486" cy="206" r="34" fill="hsl(24 14% 96%)" opacity="0.8"/>

    <!-- shoulders -->
    <path d="M132 800 q0 -206 168 -206 q168 0 168 206 z" fill="url(#top)"/>
    <path d="M132 800 q0 -206 168 -206 v206 z" fill="hsl(24 14% 78%)" opacity="0.5"/>

    <!-- neck, then head over it -->
    <rect x="266" y="410" width="68" height="112" rx="34" fill="hsl(12 22% 36%)"/>
    <!-- hair behind -->
    <path d="M196 386 q0 -142 104 -142 q104 0 104 142 q0 54 -20 84 q6 -104 -84 -104 q-90 0 -84 104 q-20 -30 -20 -84 z" fill="hsl(12 26% 14%)"/>
    <ellipse cx="300" cy="378" rx="94" ry="106" fill="url(#skin)"/>
    <!-- hair falling either side -->
    <path d="M206 350 q-14 130 6 196 q-42 -34 -40 -128 q2 -52 34 -68 z" fill="hsl(12 26% 14%)"/>
    <path d="M394 350 q14 130 -6 196 q42 -34 40 -128 q-2 -52 -34 -68 z" fill="hsl(12 26% 14%)"/>

    <!-- the smallest hint of a face, kept abstract on purpose -->
    <ellipse cx="266" cy="372" rx="8" ry="10" fill="hsl(12 22% 8%)" opacity="0.55"/>
    <ellipse cx="334" cy="372" rx="8" ry="10" fill="hsl(12 22% 8%)" opacity="0.55"/>
    <path d="M280 424 q20 14 40 0" stroke="hsl(12 22% 14%)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <text x="300" y="772" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" letter-spacing="1.8" fill="hsl(24 14% 44%)" opacity="0.45">PLACEHOLDER PHOTO</text>
</svg>
