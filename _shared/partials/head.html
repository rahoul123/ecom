<!doctype html>
<!--
  {{PAGE_TITLE}}
  Static site. No build step, no server. Upload this folder as-is via FTP.
  Brand identity, products and Shopify redirect links all live in js/brand-config.js.
-->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="{{THEME_COLOR}}">

<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESC}}">
<link rel="canonical" href="https://{{DOMAIN}}/{{PAGE_PATH}}">
{{ROBOTS}}

<!-- Open Graph / social + ad previews -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{BRAND_NAME}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESC}}">
<meta property="og:url" content="https://{{DOMAIN}}/{{PAGE_PATH}}">
<meta property="og:image" content="https://{{DOMAIN}}/{{OG_IMG}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{FONT_LINK}}

<link rel="stylesheet" href="css/base.css?v={{ASSET_V}}">
<link rel="stylesheet" href="css/brand.css?v={{ASSET_V}}">

<!--
  Load order matters. brand-config.js first (data), theme-init.js second
  (applies colours before first paint), then site.js (renderers), then
  tracking.js (inert until you add pixel IDs). All synchronous and tiny —
  that is what lets inline render calls run during parse with zero layout shift.
-->
<script src="js/brand-config.js?v={{ASSET_V}}"></script>
<script src="js/theme-init.js?v={{ASSET_V}}"></script>
<script src="js/site.js?v={{ASSET_V}}"></script>
<script src="js/tracking.js?v={{ASSET_V}}"></script>
<script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
{{JSONLD}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
