<!-- ===== HEADER — duplicated in every .html file. Change it in _shared/partials/header.html
     and re-run `node _tools/generate.js`, or find-and-replace across all pages. ===== -->
<div class="announcement">
  <span data-brand-announcement>{{ANNOUNCEMENT}}</span>
</div>

<header class="site-header">
  <div class="container header-inner">
    <a class="header-logo" href="index.html">
      <!-- [[PLACEHOLDER: logo]] — replace images/logo.svg, or point BRAND.logo elsewhere -->
      <img data-brand-logo src="{{LOGO_IMG}}" alt="{{BRAND_NAME}}" width="148" height="40">
    </a>

    <nav class="header-nav" aria-label="Main">
      <a href="index.html">Home</a>

      <!-- Shop is a plain link to every product. -->
      <a href="shop.html">Shop</a>

      <!-- Categories: mega menu. Category list on the left, and the products of
           whichever category is hovered on the right. Both are built from
           PRODUCTS at runtime — see Site.renderCategoryMenu(). -->
      <div class="nav-item" id="categories-nav-item">
        <a class="nav-trigger" href="shop.html" aria-expanded="false" aria-haspopup="true" aria-controls="categories-menu">
          Categories
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </a>
        <div class="nav-menu nav-menu--mega" id="categories-menu">
          <div class="nav-mega">
            <div>
              <div class="nav-mega__cats" id="mega-cats"></div>
              <a class="nav-mega__all" href="shop.html">
                <span>View all products</span>
                <span id="mega-total"></span>
              </a>
            </div>
            <div class="nav-mega__panel">
              <div class="nav-mega__panel-head">
                <h4 class="nav-mega__panel-title" id="mega-panel-title"></h4>
                <a class="nav-mega__panel-link" id="mega-panel-link" href="shop.html">See all &rarr;</a>
              </div>
              <div class="nav-mega__products" id="mega-products"></div>
            </div>
          </div>
        </div>
      </div>

      <a href="index.html#how-it-works">How it works</a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
    </nav>

    <div class="header-actions">
      <a class="btn btn--primary btn--sm" href="shop.html">{{PRIMARY_CTA}}</a>

      <!-- Cart icon is a shop link: checkout lives on the Shopify store, not here. -->
      <a class="icon-btn" href="shop.html" aria-label="View all products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      </a>

      <button type="button" class="icon-btn nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobile-nav">
  <div class="mobile-nav__scrim"></div>
  <div class="mobile-nav__panel" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="mobile-nav__head">
      <img data-brand-logo src="{{LOGO_IMG}}" alt="{{BRAND_NAME}}" width="130" height="35">
      <button type="button" class="icon-btn mobile-nav__close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="mobile-nav__links" aria-label="Mobile">
      <a href="index.html">Home</a>

      <a href="shop.html">Shop</a>

      <!-- Tap the text for all products; tap the chevron to open the categories. -->
      <div class="mobile-nav__row">
        <a href="shop.html">Categories</a>
        <button type="button" class="mobile-nav__sub-toggle" aria-expanded="false" aria-controls="mobile-categories-menu" aria-label="Show product categories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="mobile-nav__sub" id="mobile-categories-menu"><div></div></div>

      <a href="index.html#how-it-works">How it works</a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="mobile-nav__foot">
      <a class="btn btn--primary btn--block" href="shop.html">{{PRIMARY_CTA}}</a>
    </div>
  </div>
</div>

<main id="main">
